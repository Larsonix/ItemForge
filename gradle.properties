# Gradle settings
org.gradle.jvmargs=-Xmx1G -Dfile.encoding=UTF-8
org.gradle.daemon=true
org.gradle.caching=true
org.gradle.parallel=true
org.gradle.java.installations.auto-download=true
org.gradle.java.installations.auto-detect=true

# Project metadata
projectGroup=me.itemforge
projectVersion=1.1.0

# Runtime compatibility range, expanded into src/main/resources/manifest.json at build time.
#
# THIS IS A MEASURED OUTPUT, NOT A CHOICE. `python -B tools/apifloor.py` resolves the built jar's
# bytecode against real engine jars and prints the range it actually links against; run it with
# --write-range and it rewrites this line for you. Do not hand-edit it to a value you have not
# measured — a wrong range does not stop the plugin loading, it makes the server red-nag every
# admin on join, so nothing forces you to notice you were wrong.
#
# It lives here rather than as a literal in manifest.json so there is ONE home for it, so
# versioncheck.py can validate it, and so apifloor.py can write it mechanically.
#
# ⚠ Deliberately NOT derived from hytaleServerVersion below. Coupling the two was a latent bug: the
# loader parses this with SemverRange.fromString, which rejects a bare patch version like "0.5.3"
# (bare ranges only parse when the patch is zero). They answer different questions — one is what we
# compiled against, this is what we are known to run on.
#
# Measured 2026-08-27, after Update 6 shipped: 0 owned misses on 0.5.0/0.5.3/0.5.7/0.5.8/0.5.9 and
# on a real 0.6.0 jar, so the measured Java-linkage range is 0.5.0 through 0.6.0 inclusive. The
# play-test also passed on a 0.6.0 server, which is the half apifloor cannot prove: it sees bytecode
# linkage and not asset schemas, codec assumptions, the client UI protocol, or changed meaning behind
# an unchanged signature. Both halves are why this reads <0.7.0 rather than <0.6.1. It was written by
# `apifloor.py --write-range --playtested`, which refuses without both.
serverVersionRange=>=0.5.0 <0.7.0

# Hytale Server SDK version (from https://maven.hytale.com/release)
#
# DO NOT use "latest.release" — Maven resolves date-based versions (2026.03.26-*) above semver.
#
# ⚠ Hytale PRUNES old versions from the Maven repo, and it keeps exactly five. This property sat at
# 0.5.0 until 2026-08-27, and by then 0.5.0 had been removed upstream, so the build could no longer
# resolve its own SDK — `./gradlew build` failed with "Could not find Server-0.5.0.jar" on a machine
# whose Gradle cache had been cleaned. A stale pin here is not merely inaccurate, it eventually stops
# building altogether.
#
# ⚠ Measured how fast that happens, on 2026-08-27, twice in one day. At 09:00 /release published
# 0.5.5 through 0.5.9. At 14:12 it published 0.6.0 and 0.5.5 was already gone. So the window is one
# release, not one month: whatever is oldest of five drops the moment a new version lands. Archive
# every jar you might want to measure against, because you cannot fetch it back.
#
# This is the COMPILE-TIME SDK only. It is deliberately NOT coupled to the `ServerVersion` range in
# src/main/resources/manifest.json — see the comment on processResources in build.gradle.kts for
# why. The range ItemForge actually runs on is measured by tools/apifloor.py against archived
# engine jars in ../APIReference/downloads/, not inferred from this number.
hytaleServerVersion=0.6.0

# Dependency versions
snakeyamlVersion=2.5
shadowVersion=9.3.1
kotlinVersion=2.3.0
